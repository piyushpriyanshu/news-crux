name: Build and release

# Bump android:versionName in AndroidManifest.xml and push to main (or push a tag like v1.6.1):
# the APK is built, signed and published as a GitHub Release.
# The app checks the latest release on open and every 6 hours.
on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK tools
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "Using $BT"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml | head -1); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NC_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.NC_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # pasted secrets often pick up spaces or line breaks; strip them
            # and sometimes the labels around them ("Name: …", "Value: …"): keep only the key and the password
            B64=$(printf '%s' "$KEYSTORE_B64" | grep -oE '[A-Za-z0-9+/]{200,}={0,2}' | awk '{ if (length($0) > length(b)) b = $0 } END { print b }')
            [ -n "$B64" ] || B64=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n')
            PASS=$(printf '%s' "$KEYSTORE_PASS" | tr '\r' '\n' | sed 's/.*Value:[[:space:]]*//' | grep -v -i '^[[:space:]]*\(secret\|name:\)' | tr -d ' \t\n')
            echo "::add-mask::$PASS"
            if ! printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/newscrux.p12" 2>/dev/null; then
              echo "::error::NC_KEYSTORE_B64 is not valid base64 (length ${#B64}; expected 3516). Paste the whole Secret 1 line again."; exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/newscrux.p12" -storetype PKCS12 -storepass "$PASS" -alias newscrux > /dev/null 2>&1; then
              echo "::error::The keystore did not open with NC_KEYSTORE_PASS (key length ${#B64}, password length ${#PASS}; expected 3516 and 24)."; exit 1
            fi
            echo "KS=$RUNNER_TEMP/newscrux.p12" >> "$GITHUB_ENV"
            { echo "KS_PASS=$PASS"; echo "KEY_PASS=$PASS"; echo "SIGNED=1"; } >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Add the NC_KEYSTORE_B64 and NC_KEYSTORE_PASS repository secrets to sign releases."; exit 1
          else
            # build check only: a throwaway key (this APK can't update the installed app)
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.p12" -storetype PKCS12 -storepass cipass1 -keypass cipass1 \
              -alias newscrux -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI" > /dev/null
            { echo "KS=$RUNNER_TEMP/ci.p12"; echo "KS_PASS=cipass1"; echo "KEY_PASS=cipass1"; } >> "$GITHUB_ENV"
          fi

      - name: Build
        run: KEY_ALIAS=newscrux ./build.sh

      - name: Tests
        run: ./tests/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: NewsCrux-${{ env.VERSION }}
          path: build/NewsCrux-*.apk

      - name: Publish release
        # A tag push, or a push to main whose versionName has no release yet, publishes that version.
        if: env.SIGNED == '1' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "Release $TAG already exists; nothing to publish."; exit 0; fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$TAG" "build/NewsCrux-$VERSION.apk" --target "$GITHUB_SHA" --title "News Crux $VERSION" "${ARGS[@]}"
