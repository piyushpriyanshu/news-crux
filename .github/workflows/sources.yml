name: Source check

# Reads every news source live the way the app does and reports what works.
# Runs daily, on a push to the "probe" branch, or by hand. The report goes to the probe-report branch;
# a failing source opens (or updates) an issue titled "Source check".
on:
  schedule:
    - cron: '17 23 * * *'   # 4:47 AM IST, before the morning edition
  push:
    branches: [probe]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Read every source
        run: mkdir -p probe && ./tools/probe/run.sh > probe/stdout.txt 2>&1 || (cat probe/stdout.txt; exit 1)
      - name: Save the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp probe/report.json probe/report.md out/
          cd out && git init -q && git checkout -q -b probe-report
          git -c user.name=news-crux-check -c user.email=check@users.noreply.github.com add . 
          git -c user.name=news-crux-check -c user.email=check@users.noreply.github.com commit -qm "Source check $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-report
